# render.yaml
# Lead CRM — Backend API + React/Vite Frontend SPA

services:

  # ============================================================
  # BACKEND API
  # ============================================================
  - type: web
    name: leads-crm-api
    runtime: node
    rootDir: server

    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start

    healthCheckPath: /health

    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 1d

      - key: FRONTEND_URL
        value: https://leads-ai-1.onrender.com

      - key: BACKEND_URL
        value: https://leads-ai-d4cx.onrender.com

      # --------------------------------------------------------
      # META
      # --------------------------------------------------------
      - key: META_APP_ID
        sync: false

      - key: META_APP_SECRET
        sync: false

      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false

      - key: META_GRAPH_VERSION
        value: v25.0

      - key: META_TOKEN_KEY
        generateValue: true

      # --------------------------------------------------------
      # WHATSAPP
      # --------------------------------------------------------
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false

      - key: WHATSAPP_ACCESS_TOKEN
        sync: false

      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false


  # ============================================================
  # FRONTEND — REACT / VITE SPA
  # ============================================================
  - type: web
    name: leads-crm-web
    runtime: static

    rootDir: client

    buildCommand: npm install --legacy-peer-deps && npm run build

    staticPublishPath: ./dist

    autoDeploy: true

    # IMPORTANT:
    # React Router requires ALL unknown frontend paths
    # to return index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_URL
        value: https://leads-ai-d4cx.onrender.com/api